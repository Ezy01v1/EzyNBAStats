[project]
name = "sportslab"
version = "0.1.0"
description = "Sports Analytics Lab: NBA analytics modules on a shared, cached data layer."
readme = "README.md"
authors = [
    { name = "Ezy01v1", email = "danielpadilla1725@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "nba-api>=1.12.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits the real stats.nba.com (slow, needs internet; run with `-m network`)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]  # chart titles in notebooks read better as one long f-string
